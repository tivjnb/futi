name: files
description: File search and counting helpers
commands:
  large:
    description: Find files larger than a given size
    flags:
      - name: dir
        default: "."
        description: Directory to search
      - name: size
        default: "100M"
        description: Minimum size in find(1) notation, for example 100M or 2G
    cmd: "find {{.dir}} -type f -size +{{.size}}"
  count:
    description: Count lines in the given files
    args:
      - name: files
        required: true
        variadic: true
        description: Files to count lines in
    cmd: "wc -l -- {{.files}}"
